name: Build and deploy

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Real MapleStory art and music, extracted from a client downloaded here. Never fails the build:
      # on any problem the script logs a warning and the site keeps its placeholder art.
      - name: Free disk space
        continue-on-error: true
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install extraction tools
        continue-on-error: true
        run: |
          sudo apt-get update || true
          sudo apt-get install -y innoextract p7zip-full || true
      - uses: actions/cache@v4
        with:
          path: .maple-cache
          key: maple-wz-${{ hashFiles('scripts/maple-sources.json') }}
          restore-keys: maple-wz-
      - name: Extract Maple assets
        continue-on-error: true
        run: node --experimental-strip-types scripts/fetch-maple.ts dist
        env:
          MAPLE_ARCHIVE_URL: ${{ vars.MAPLE_ARCHIVE_URL }}
      - name: Dump attack data (temporary)
        continue-on-error: true
        run: node --experimental-strip-types scripts/dump-attack.ts
      # Branch builds only: screenshots of the login screens with the real art, logged as base64 (scripts/shoot.mjs)
      - name: Screenshots
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/shoot.mjs dist
      - if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    # The site stays off until the owner sets the PAGES_ENABLED repo variable to 'true'.
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
